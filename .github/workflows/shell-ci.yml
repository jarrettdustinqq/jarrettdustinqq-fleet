name: Shell CI

on:
  push:
    paths:
      - "**.sh"
      - "**.py"
      - "fleetctl"
      - "repos.txt"
      - ".github/workflows/shell-ci.yml"
  pull_request:
    paths:
      - "**.sh"
      - "**.py"
      - "fleetctl"
      - "repos.txt"
      - ".github/workflows/shell-ci.yml"

jobs:
  shell-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Normalize shell modes
        run: chmod +x ops/fleet_host_remediation.sh tests/test_fleet_host_remediation.sh

      - name: Bash syntax
        run: bash -n bootstrap.sh healthcheck.sh install_nix.sh fleetctl ops/seed_linear_issues.sh ops/fleet_host_remediation.sh tests/test_bootstrap.sh tests/test_healthcheck.sh tests/test_fleet_host_remediation.sh

      - name: ShellCheck
        run: shellcheck bootstrap.sh healthcheck.sh install_nix.sh fleetctl ops/seed_linear_issues.sh ops/fleet_host_remediation.sh tests/test_bootstrap.sh tests/test_healthcheck.sh tests/test_fleet_host_remediation.sh

      - name: Bootstrap tests
        run: bash tests/test_bootstrap.sh

      - name: Healthcheck tests
        run: bash tests/test_healthcheck.sh

      - name: Host remediation tests
        run: bash tests/test_fleet_host_remediation.sh

      - name: Python syntax
        run: python3 -m py_compile ops/chat_work_agent.py ops/control_hub_agent.py ops/control_hub_safe_entry.py ops/control_hub_runtime.py ops/mission_control_agent.py ops/venture_autonomy_agent.py ops/adaptive_operations_governor.py tests/control_hub_non_root_smoke.py

      - name: Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Non-root Control Hub runtime proof
        run: |
          test "$(id -u)" -ne 0
          python3 tests/control_hub_non_root_smoke.py
